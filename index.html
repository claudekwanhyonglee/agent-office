<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agent Office</title>
  <link rel="icon" href="data:,">
</head>
<body>
<main class="stage">
  <div id="scene" aria-label="3D office with agent characters"></div>
  <div id="status" class="status" role="status">Loading the 3D office…</div>

  <div class="left">
    <header class="brand">
      <h1>Agent Office</h1>
      <span id="counts"></span>
    </header>
    <aside id="usage" class="usage" aria-label="Plan usage"></aside>
  </div>

  <aside class="card" id="card" aria-live="polite" hidden></aside>
  <div id="tooltip" class="tooltip" hidden></div>
  <button id="home" class="btn icon home" type="button" title="Back to the starting view (Home)" aria-label="Back to the starting view">⌂</button>
  <div class="hint">Drag to move · right-drag to rotate · scroll to zoom · double-click to focus · click an agent</div>
</main>
<script type="module" src="/src/client/main.ts"></script>
</body>
</html>
